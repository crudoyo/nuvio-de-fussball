name: Worker checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run addon tests
        run: npm test
      - name: Verify all 20 live 3. Liga PNG crest URLs
        run: npm run check:crests
      - name: Validate Cloudflare Workers build
        run: npx wrangler deploy --dry-run --outdir dist
      - name: Verify deployed version and report native availability
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          WORKER_SMOKE_URL: https://nuvio-de-fussball.crudolol.workers.dev
        run: node scripts/smoke.mjs
